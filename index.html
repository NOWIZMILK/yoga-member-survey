<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PT 상담신청</title>
<style>
  :root{
    --accent:#21677F;          /* Pantone 18-4225 TCX Saxony Blue */
    --accent-dim:#123a47;
    --bg:#000;
    --card:#2b2b30;
    --text:#fff;
    --sub:#8a8a90;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",sans-serif}
  .app{max-width:480px;min-height:100vh;min-height:100dvh;margin:0 auto;padding:0 20px 24px;display:flex;flex-direction:column}
  .screen{display:none;flex:1;flex-direction:column}
  .screen.active{display:flex}
  .back{background:none;border:0;color:#fff;font-size:28px;padding:14px 0 6px;width:40px;text-align:left;cursor:pointer;visibility:hidden}
  .back.show{visibility:visible}
  .progress{display:flex;gap:8px;margin:12px 0 44px}
  .progress i{flex:1;height:3px;background:#3a3a3f;border-radius:2px}
  .progress i.on{background:var(--accent)}
  h1{font-size:28px;line-height:1.35;margin:0 0 10px;font-weight:800;letter-spacing:-.5px}
  h2{font-size:28px;line-height:1.35;margin:0;font-weight:800;letter-spacing:-.5px}
  h2 small,h1 small{font-size:14px;color:var(--sub);font-weight:400;margin-left:6px}
  .hint{color:var(--sub);font-size:14px;margin:0 0 30px}
  .head{margin-top:24px}
  .head p.desc{color:#b5b5ba;font-size:15px;line-height:1.7;margin:14px 0 0}
  /* list options */
  .opt{display:flex;align-items:center;gap:14px;padding:14px 4px;font-size:17px;color:#cfcfd4;cursor:pointer;user-select:none}
  .opt .chk{width:26px;height:26px;border-radius:50%;background:#4a4a4f;display:grid;place-items:center;flex:none}
  .opt .chk svg{width:14px;height:14px;stroke:#000;stroke-width:3;fill:none}
  .opt.sel{color:#fff}
  .opt.sel .chk{background:var(--accent)}
  .opt.sel .chk svg{stroke:#fff}
  /* grid / block buttons */
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:30px}
  .stack{display:flex;flex-direction:column;gap:12px;margin-top:30px}
  .blk{background:var(--card);border:0;color:#fff;font-size:17px;padding:20px 8px;cursor:pointer;font-family:inherit}
  .blk.sel{background:var(--accent)}
  /* form */
  label{display:block;font-size:15px;color:#c8c8cd;margin:22px 0 8px}
  label em{color:var(--accent);font-style:normal;margin-left:4px;filter:brightness(1.6)}
  input[type=text],input[type=tel],input[type=number],textarea{
    width:100%;background:var(--card);border:1.5px solid transparent;color:#fff;font-size:17px;padding:16px;border-radius:0;font-family:inherit;outline:none}
  input:focus,textarea:focus{border-color:var(--accent)}
  textarea{min-height:96px;resize:vertical}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gender{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .gender .blk{padding:16px 8px}
  /* bottom button */
  .spacer{flex:1;min-height:30px}
  .next{width:100%;border:0;background:var(--accent);color:#fff;font-size:18px;font-weight:700;padding:21px;cursor:pointer;font-family:inherit}
  .next:disabled{background:var(--accent-dim);color:#5d7882;cursor:default}
  /* done */
  .done h1{font-size:30px;margin-top:90px}
  .tag{font-size:30px;font-weight:900;font-style:italic;color:var(--accent);line-height:1.3;margin:34px 0;letter-spacing:-.3px;text-transform:uppercase}
  .done p{color:var(--sub);font-size:15px;line-height:1.7;margin:0}
  .err{color:#ff6b6b;font-size:14px;margin-top:10px;display:none}
</style>
</head>
<body>
<div class="app">

  <!-- 0. 기본 인적사항 -->
  <section class="screen active" id="s-info">
    <div class="head">
      <h1>PT 상담신청</h1>
      <p class="hint">정확한 상담을 위해 기본 정보를 입력해주세요.</p>
    </div>
    <label for="name">이름<em>*</em></label>
    <input type="text" id="name" autocomplete="name" placeholder="이름을 입력해주세요">
    <div class="row2">
      <div>
        <label for="age">나이<em>*</em></label>
        <input type="number" id="age" inputmode="numeric" min="1" max="120" placeholder="예) 30">
      </div>
      <div>
        <label>성별<em>*</em></label>
        <div class="gender" id="gender">
          <button type="button" class="blk" data-v="여성">여성</button>
          <button type="button" class="blk" data-v="남성">남성</button>
        </div>
      </div>
    </div>
    <label for="phone">연락처<em>*</em></label>
    <input type="tel" id="phone" inputmode="numeric" autocomplete="tel" placeholder="010-0000-0000" maxlength="13">
    <label for="route">방문경로</label>
    <textarea id="route" placeholder="어떻게 알고 오셨나요? (예: 지인 소개, 인스타그램, 검색 등)"></textarea>
    <label for="request">기타 요청사항</label>
    <textarea id="request" placeholder="궁금하신 점이나 요청사항을 자유롭게 적어주세요"></textarea>
    <div class="spacer"></div>
    <button class="next" id="infoNext" disabled>다음</button>
  </section>

  <!-- 1. 운동 목적 -->
  <section class="screen" id="s-purpose">
    <div class="head">
      <h1>PT 상담신청</h1>
    </div>
    <h2 style="margin-top:36px">운동 목적이<br>어떻게 되시나요? <small>복수 선택 가능</small></h2>
    <div class="grid" id="purpose"></div>
    <div class="spacer"></div>
    <button class="next" disabled data-next>다음</button>
  </section>

  <!-- 2. 희망 수업시간 -->
  <section class="screen" id="s-time">
    <button class="back show" data-back>‹</button>
    <h2 style="margin-top:14px">희망 수업시간이<br>어떻게 되시나요? <small>복수 선택 가능</small></h2>
    <div class="stack" id="time"></div>
    <div class="spacer"></div>
    <button class="next" disabled data-next>다음</button>
  </section>

  <!-- 3~6. 설문 -->
  <section class="screen" id="s-q1"></section>
  <section class="screen" id="s-q2"></section>
  <section class="screen" id="s-q3"></section>
  <section class="screen" id="s-q4"></section>

  <!-- 완료 -->
  <section class="screen done" id="s-done">
    <h1>설문이<br>완료되었습니다</h1>
    <div class="tag">Bright<br>Beyond</div>
    <p>24시간 내로 트레이너가 연락드립니다.<br>편하신 시간에 상담을 진행해주세요.</p>
    <div class="spacer"></div>
    <div class="err" id="err"></div>
    <button class="next" id="doneBtn">확인</button>
  </section>
</div>

<script>
/* ▼ 응답을 받을 주소(구글 Apps Script 웹앱, Formspree 등)를 넣으면 제출 시 POST로 전송됩니다. */
const ENDPOINT = "https://script.google.com/macros/s/AKfycbxEiwxs9vbb7Ocsprn4FuEnezmGm4TlgXNB1ZXVWylnYVzBeSn9iCZAxNbhP2ihsAbu/exec";

const CHECK = '<svg viewBox="0 0 16 16"><path d="M3 8.5l3.2 3L13 4.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';

const grid = {
  purpose:["기초체력","재활훈련","벌크업","근력증가","다이어트","운동방법 학습","바디프로필","대회 준비"],
  time:["9시 이전","09-12시","12-15시","15-18시","18-21시","21시 이후"]
};
const questions = [
  {id:"q1", key:"운동을 시작하려는 이유", title:"운동을 시작하려는<br>이유는 무엇인가요?",
   opts:["건강하고 활기찬 생활을 위해서","자신감을 키우기 위해서","질병을 예방하기 위해서","재활의 목적을 위해서","대회, 촬영, 여행 등 큰 노력이 필요한 목표를 위해서","기타"]},
  {id:"q2", key:"달성하려는 목표", title:"달성하려는<br>목표는 무엇인가요?",
   opts:["체중 감량","근육량 증가","체지방 감소","신체 불균형 개선","기타"]},
  {id:"q3", key:"PT에서 기대하는 점", title:"PT에서 기대하는 점은<br>무엇인가요?",
   opts:["꾸준한 운동 습관 만들기","운동자세, 운동방법 습득","트레이너의 피드백","근육량 증가, 체지방 감소와 같은 신체적 변화","회원 맞춤 운동 루틴 제공"]},
  {id:"q4", key:"하시는 운동", title:"하시는 운동이<br>있나요?",
   opts:["걷기, 달리기","축구, 농구와 같은 구기 운동","테니스, 탁구와 같은 라켓 운동","요가, 필라테스","수영","자전거","기타","해당사항 없음"], none:"해당사항 없음"}
];
const flow = ["s-info","s-purpose","s-time","s-q1","s-q2","s-q3","s-q4","s-done"];
const state = {gender:"", purpose:[], time:[]};
questions.forEach(q=>state[q.id]=[]);
let cur = 0;
const $ = s=>document.querySelector(s);

function show(i){
  cur = i;
  document.querySelectorAll(".screen").forEach(e=>e.classList.remove("active"));
  $("#"+flow[i]).classList.add("active");
  window.scrollTo(0,0);
}

/* 인적사항 */
const f = {name:$("#name"),age:$("#age"),phone:$("#phone"),route:$("#route"),request:$("#request")};
function checkInfo(){
  const ok = f.name.value.trim() && +f.age.value>0 && state.gender && f.phone.value.replace(/\D/g,"").length>=10;
  $("#infoNext").disabled = !ok;
}
Object.values(f).forEach(el=>el.addEventListener("input",checkInfo));
f.phone.addEventListener("input",()=>{
  let d=f.phone.value.replace(/\D/g,"").slice(0,11);
  f.phone.value = d.length>7 ? d.replace(/(\d{3})(\d{3,4})(\d{0,4})/,"$1-$2-$3") : d.length>3 ? d.replace(/(\d{3})(\d+)/,"$1-$2") : d;
  checkInfo();
});
document.querySelectorAll("#gender .blk").forEach(b=>b.onclick=()=>{
  state.gender=b.dataset.v;
  document.querySelectorAll("#gender .blk").forEach(x=>x.classList.toggle("sel",x===b));
  checkInfo();
});
$("#infoNext").onclick=()=>show(1);

/* 그리드(복수 선택) */
function buildBlocks(id,list,btnScreen){
  const box=$("#"+id);
  list.forEach(t=>{
    const b=document.createElement("button");
    b.className="blk";b.type="button";b.textContent=t;
    b.onclick=()=>{
      const a=state[id], k=a.indexOf(t);
      k>=0?a.splice(k,1):a.push(t);
      b.classList.toggle("sel",k<0);
      $("#"+btnScreen+" [data-next]").disabled=!a.length;
    };
    box.appendChild(b);
  });
}
buildBlocks("purpose",grid.purpose,"s-purpose");
buildBlocks("time",grid.time,"s-time");

/* 설문 화면(최대 3개 선택) */
questions.forEach((q,qi)=>{
  const el=$("#s-"+q.id);
  el.innerHTML=`
    <button class="back show" data-back>‹</button>
    <div class="progress">${questions.map((_,i)=>`<i class="${i===qi?"on":""}"></i>`).join("")}</div>
    <h2>${q.title}</h2>
    <p class="hint" style="margin-top:12px">복수 선택(최대 3개)</p>
    <div class="list"></div>
    <div class="spacer"></div>
    <button class="next" disabled data-next>다음</button>`;
  const list=el.querySelector(".list");
  q.opts.forEach(t=>{
    const d=document.createElement("div");
    d.className="opt";
    d.innerHTML=`<span class="chk">${CHECK}</span><span>${t}</span>`;
    d.onclick=()=>{
      let a=state[q.id];
      const on=a.includes(t);
      if(on){a=a.filter(x=>x!==t)}
      else if(q.none && t===q.none){a=[t]}
      else{
        if(q.none) a=a.filter(x=>x!==q.none);
        if(a.length>=3) return;
        a.push(t);
      }
      state[q.id]=a;
      list.querySelectorAll(".opt").forEach(o=>o.classList.toggle("sel",a.includes(o.lastChild.textContent)));
      el.querySelector("[data-next]").disabled=!a.length;
    };
    list.appendChild(d);
  });
});

/* 이동 */
document.querySelectorAll("[data-back]").forEach(b=>b.onclick=()=>show(cur-1));
document.querySelectorAll("[data-next]").forEach(b=>b.onclick=()=>{
  if(flow[cur+1]==="s-done"){ submit(); }
  show(cur+1);
});

/* 제출 */
function payload(){
  const p={
    제출시각:new Date().toLocaleString("ko-KR"),
    이름:f.name.value.trim(), 나이:f.age.value, 성별:state.gender,
    연락처:f.phone.value, 방문경로:f.route.value.trim(), 기타요청사항:f.request.value.trim(),
    "운동 목적":state.purpose.join(", "), "희망 수업시간":state.time.join(", ")
  };
  questions.forEach(q=>p[q.key]=state[q.id].join(", "));
  return p;
}
function submit(){
  const data=payload();
  try{localStorage.setItem("pt_survey_last",JSON.stringify(data));}catch(e){}
  if(!ENDPOINT){console.log("설문 응답",data);return;}
  fetch(ENDPOINT,{method:"POST",mode:"no-cors",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify(data)})
    .catch(()=>{const e=$("#err");e.textContent="전송에 실패했습니다. 트레이너에게 직접 연락 부탁드립니다.";e.style.display="block";});
}
$("#doneBtn").onclick=()=>location.reload();
</script>
</body>
</html>
